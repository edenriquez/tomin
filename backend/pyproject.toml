[project]
name = "tomin-backend"
version = "0.2.0"
description = "Tomin backend: hexagonal Flask API with a local OCR/parse pipeline and DuckDB analytics cube"
authors = [{ name = "Tomin Team" }]
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "pyjwt>=2.8",
    "duckdb>=0.10",
    "pdfplumber>=0.11",
    # Runtime dependency, not dev-only: Container.bootstrap() runs
    # `alembic.command.upgrade` programmatically on startup.
    "alembic>=1.13",
]

[project.optional-dependencies]
# Heavy OCR engines are optional; the pipeline falls back gracefully without them.
ocr = ["pytesseract>=0.3.10", "pdf2image>=1.17", "pillow>=10.0"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
